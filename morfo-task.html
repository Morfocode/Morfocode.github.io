
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MORFO TASK | MORFOCODE</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 30px 16px;
  background: #090909;
  color: #f5f5f5;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 650px;
  margin: 40px auto;
}

header {
  text-align: center;
  margin-bottom: 40px;
}

.logo {
  color: #d6ad55;
  font-size: 14px;
  letter-spacing: 5px;
}

h1 {
  color: #d6ad55;
  font-size: 38px;
  letter-spacing: 4px;
  margin-bottom: 8px;
}

.subtitle {
  color: #999;
}

.panel {
  background: #151515;
  border: 1px solid #333;
  border-radius: 14px;
  padding: 22px;
}

.input-area {
  display: flex;
  gap: 10px;
  margin-bottom: 22px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  background: #222;
  border: 1px solid #444;
  border-radius: 8px;
  color: white;
  font-size: 15px;
}

button {
  border: none;
  border-radius: 8px;
  padding: 12px 16px;
  background: #d6ad55;
  color: #111;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #f0cf7a;
}

.filters {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.filters button {
  background: #292929;
  color: #ddd;
}

.filters button.active {
  background: #d6ad55;
  color: #111;
}

.task {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 0;
  border-bottom: 1px solid #333;
}

.task span {
  flex: 1;
  overflow-wrap: anywhere;
}

.task.done span {
  color: #777;
  text-decoration: line-through;
}

.task input {
  flex: none;
  width: 18px;
  height: 18px;
  accent-color: #d6ad55;
}

.delete {
  background: #382222;
  color: #ffaaaa;
  padding: 8px 11px;
}

.empty {
  text-align: center;
  color: #777;
  padding: 25px 0;
}

footer {
  text-align: center;
  margin-top: 30px;
  color: #777;
  font-size: 12px;
}

@media (max-width: 430px) {
  .input-area {
    flex-direction: column;
  }
}
  .priority {
  padding: 5px 10px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: bold;
  margin: 0 8px;
}

.priority.alta {
  background: #5c2020;
  color: #ff7777;
}

.priority.media {
  background: #5c4a18;
  color: #ffd45c;
}

.priority.baja {
  background: #204b2b;
  color: #7ee795;
}
</style>
</head>

<body>
<div class="container">

<header>
  <div class="logo">MORFOCODE</div>
  <h1>MORFO TASK</h1>
  <p class="subtitle">Organizá tus ideas. Cumplí tus objetivos.</p>
</header>

<main class="panel">
  <div class="input-area">
    <input id="taskInput" type="text"
      placeholder="Escribí una nueva tarea..."
      maxlength="120">
    <select id="taskPriority">
  <option value="Baja">Prioridad baja</option>
  <option value="Media" selected>Prioridad media</option>
  <option value="Alta">Prioridad alta</option>
    </select>
    <button onclick="addTask()">Agregar</button>
  </div>

  <div class="filters">
    <button class="active" onclick="setFilter('all', this)">Todas</button>
    <button onclick="setFilter('pending', this)">Pendientes</button>
    <button onclick="setFilter('done', this)">Completadas</button>
  </div>

  <div id="taskList"></div>
</main>

<footer>
  Un proyecto de MORFOCODE · Las ideas toman forma en código.
</footer>

</div>

<script>
let tasks = JSON.parse(localStorage.getItem("morfoTasks") || "[]");
let currentFilter = "all";

function saveTasks() {
  localStorage.setItem("morfoTasks", JSON.stringify(tasks));
}

function addTask() {
  const input = document.getElementById("taskInput");
  const title = input.value.trim();
const priority = document.getElementById("taskPriority").value;
  if (!title) return;

  tasks.push({
  id: Date.now(),
  title: title,
  priority: priority,
  done: false
});

  input.value = "";
  saveTasks();
  renderTasks();
}

function toggleTask(id) {
  tasks = tasks.map(task =>
    task.id === id ? {...task, done: !task.done} : task
  );

  saveTasks();
  renderTasks();
}

function deleteTask(id) {
  tasks = tasks.filter(task => task.id !== id);
  saveTasks();
  renderTasks();
}

function setFilter(filter, button) {
  currentFilter = filter;

  document.querySelectorAll(".filters button")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");
  renderTasks();
}

function renderTasks() {
  const list = document.getElementById("taskList");

  const filtered = tasks.filter(task => {
    if (currentFilter === "pending") return !task.done;
    if (currentFilter === "done") return task.done;
    return true;
  });

  list.innerHTML = "";

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">No hay tareas para mostrar.</div>';
    return;
  }

  filtered.forEach(task => {
    const item = document.createElement("div");
    item.className = "task" + (task.done ? " done" : "");

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = task.done;
    checkbox.addEventListener("change", () => toggleTask(task.id));

    const title = document.createElement("span");
    title.textContent = task.title;
const priority = document.createElement("span");
priority.className = "priority " + (task.priority || "Media").toLowerCase();
priority.textContent = task.priority || "Media";
    const remove = document.createElement("button");
    remove.className = "delete";
    remove.textContent = "Eliminar";
    remove.addEventListener("click", () => deleteTask(task.id));

    item.append(checkbox, title, priority, remove);
    list.appendChild(item);
  });
}

document.getElementById("taskInput")
  .addEventListener("keydown", event => {
    if (event.key === "Enter") addTask();
  });

renderTasks();
</script>
</body>
  </html>
